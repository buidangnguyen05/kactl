name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pdf:
    name: Build PDF (max 26 pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended texlive-plain-generic
    - name: Build kactl.pdf
      run: make kactl
    - name: Check page count (cover included)
      run: make check-pages MAX_PAGES=26
    - name: Upload PDFs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kactl-pdf
        path: |
          kactl.pdf
          test-session.pdf
        if-no-files-found: warn

  compiles:
    name: Compile all headers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Compile every header in content/
      run: make test-compiles

  stress-tests:
    name: Stress tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Run everything in stress-tests/
      run: make test
