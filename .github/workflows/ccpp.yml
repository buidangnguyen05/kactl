name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run, except on main,
# where every run finishes so its Pages deployment is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pdf:
    name: Build PDF (max 26 pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended texlive-plain-generic
    - name: Build kactl.pdf
      run: make kactl
    - name: Check page count (cover included)
      run: make check-pages MAX_PAGES=26
    - name: Upload PDFs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kactl-pdf
        path: |
          kactl.pdf
          test-session.pdf
        if-no-files-found: warn
    - name: Build contents page
      run: mkdir -p site && python3 doc/scripts/make-contents.py site/contents.html
    - name: Prepare Pages site
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cp kactl.pdf test-session.pdf site/
        pages=$(sed -n 's/^Output written on .* (\([0-9]*\) pages.*/\1/p' build/kactl.log | tail -n 1)
        cat > site/index.html <<EOF
        <!doctype html><meta charset="utf-8"><title>KACTL notebook</title>
        <h1>KACTL notebook</h1>
        <p><a href="kactl.pdf">kactl.pdf</a> ($pages pages) &middot; <a href="contents.html">What's in it</a> (searchable contents) &middot; <a href="test-session.pdf">test-session.pdf</a></p>
        <p>Built from <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${GITHUB_SHA::7}</a> on $(date -u '+%Y-%m-%d %H:%M UTC').</p>
        EOF
    - name: Upload Pages site
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  compiles:
    name: Compile all headers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Compile every header in content/
      run: make test-compiles

  stress-tests:
    name: Stress tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Run everything in stress-tests/
      run: make test

  # Publishes the PDFs at https://<owner>.github.io/<repo>/, but only for a
  # push to main where everything passed, so the link always shows a good build.
  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pdf, compiles, stress-tests]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}kactl.pdf
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
